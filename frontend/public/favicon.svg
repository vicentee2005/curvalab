<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo discreto en tono azul pizarra (Dark Slate) -->
  <rect width="512" height="512" rx="96" fill="#0F172A" />

  <!-- Rejilla tenue de fondo (Papel de laboratorio) -->
  <path d="M 130 100 V 410 M 230 100 V 410 M 330 100 V 410 M 430 100 V 410" stroke="#1E293B" stroke-width="6" stroke-dasharray="12,12" />
  <path d="M 100 130 H 430 M 100 230 H 430 M 100 330 H 430 M 100 410 H 430" stroke="#1E293B" stroke-width="6" stroke-dasharray="12,12" />

  <!-- Ejes coordenados X/Y (Líneas sobrias de software técnico) -->
  <path d="M 110 100 V 410 H 420" stroke="#64748B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Barras de error experimentales discretas (Gris neutro) -->
  <!-- Punto 1 -->
  <g stroke="#94A3B8" stroke-width="12" stroke-linecap="round">
    <line x1="180" y1="280" x2="180" y2="360" />
    <line x1="160" y1="280" x2="200" y2="280" />
    <line x1="160" y1="360" x2="200" y2="360" />
  </g>
  
  <!-- Punto 2 -->
  <g stroke="#94A3B8" stroke-width="12" stroke-linecap="round">
    <line x1="280" y1="180" x2="280" y2="260" />
    <line x1="260" y1="180" x2="300" y2="180" />
    <line x1="260" y1="260" x2="300" y2="260" />
  </g>

  <!-- Punto 3 -->
  <g stroke="#94A3B8" stroke-width="12" stroke-linecap="round">
    <line x1="370" y1="120" x2="370" y2="190" />
    <line x1="350" y1="120" x2="390" y2="120" />
    <line x1="350" y1="190" x2="390" y2="190" />
  </g>

  <!-- Recta / Curva de ajuste por mínimos cuadrados (Azul clásico Matplotlib/RStudio) -->
  <path d="M 120 370 L 400 130" stroke="#2563EB" stroke-width="24" stroke-linecap="round" fill="none" />

  <!-- Puntos experimentales (Nodos limpios) -->
  <circle cx="180" cy="320" r="18" fill="#60A5FA" />
  <circle cx="280" cy="220" r="18" fill="#60A5FA" />
  <circle cx="370" cy="155" r="18" fill="#60A5FA" />
</svg>
